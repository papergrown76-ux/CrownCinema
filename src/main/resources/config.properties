# Leave empty to host the embedded resource pack automatically on this proxy.
# Optional override: an external HTTP(S) direct download URL.
pack.url=
# Allow this TCP port through your firewall (and publish it for Docker, if used).
pack.http.enabled=true
pack.http.bind=0.0.0.0
pack.http.port=8124
# Empty: use the hostname/IP that the player entered in Minecraft.
# If DNS SRV, a TCP proxy, or a separate download host is used, set the public
# hostname/IP of this Velocity machine here, without http:// or a port.
pack.http.public-host=
# If true, Minecraft disconnects modern clients who decline. Old clients are never offered it.
pack.required=false
cinema.endcard-seconds=3
cinema.join-ticket-seconds=300
cinema.max-viewers=200
# Playback is OFF on any server not explicitly listed here.
# Use registered server names from velocity.toml. PROXY is only for safe lobbies.
cinema.server.lobby=proxy
# cinema.server.survival=bridge
# cinema.server.pvp=off
message.upgrade=Crown Cinema requires Minecraft Java 1.20.3 or newer. Please update your client. You can continue playing normally.
